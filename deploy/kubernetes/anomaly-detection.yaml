apiVersion: apps/v1
kind: Deployment
metadata:
  name: anomaly-detection
  namespace: finops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: anomaly-detection
  template:
    metadata:
      labels:
        app: anomaly-detection
    spec:
      containers:
      - name: anomaly
        image: finops/anomaly-detection:latest
        ports:
        - containerPort: 8002
        env:
        - name: PORT
          value: "8002"
        - name: CLICKHOUSE_ADDR
          valueFrom:
            configMapKeyRef:
              name: finops-config
              key: CLICKHOUSE_ADDR
        livenessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8002
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: anomaly-detection
  namespace: finops
spec:
  selector:
    app: anomaly-detection
  ports:
  - port: 8002
    targetPort: 8002

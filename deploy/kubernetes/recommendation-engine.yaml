apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-engine
  namespace: finops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommendation-engine
  template:
    metadata:
      labels:
        app: recommendation-engine
    spec:
      containers:
      - name: recommendation
        image: finops/recommendation-engine:latest
        ports:
        - containerPort: 8003
        env:
        - name: PORT
          value: "8003"
        - name: CLICKHOUSE_ADDR
          valueFrom:
            configMapKeyRef:
              name: finops-config
              key: CLICKHOUSE_ADDR
        - name: USD_TO_BRL_RATE
          valueFrom:
            configMapKeyRef:
              name: finops-config
              key: USD_TO_BRL_RATE
        livenessProbe:
          httpGet:
            path: /live
            port: 8003
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8003
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: recommendation-engine
  namespace: finops
spec:
  selector:
    app: recommendation-engine
  ports:
  - port: 8003
    targetPort: 8003

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-service
  namespace: finops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingestion-service
  template:
    metadata:
      labels:
        app: ingestion-service
    spec:
      containers:
      - name: ingestion
        image: finops/ingestion-service:latest
        ports:
        - containerPort: 8081
        env:
        - name: PORT
          value: "8081"
        - name: KAFKA_BROKERS
          valueFrom:
            configMapKeyRef:
              name: finops-config
              key: KAFKA_BROKERS
        - name: HUAWEI_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: finops-secrets
              key: huawei-access-key
        - name: HUAWEI_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: finops-secrets
              key: huawei-secret-key
        livenessProbe:
          httpGet:
            path: /live
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion-service
  namespace: finops
spec:
  selector:
    app: ingestion-service
  ports:
  - port: 8081
    targetPort: 8081

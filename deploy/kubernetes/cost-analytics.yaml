apiVersion: apps/v1
kind: Deployment
metadata:
  name: cost-analytics
  namespace: finops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cost-analytics
  template:
    metadata:
      labels:
        app: cost-analytics
    spec:
      containers:
      - name: cost-analytics
        image: finops/cost-analytics:latest
        ports:
        - containerPort: 8082
        env:
        - name: PORT
          value: "8082"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: finops-secrets
              key: postgres-password
        - name: POSTGRES_DSN
          value: "postgres://finops:$(POSTGRES_PASSWORD)@postgres:5432/finops?sslmode=disable"
        - name: CLICKHOUSE_ADDR
          valueFrom:
            configMapKeyRef:
              name: finops-config
              key: CLICKHOUSE_ADDR
        - name: CLICKHOUSE_DB
          valueFrom:
            configMapKeyRef:
              name: finops-config
              key: CLICKHOUSE_DB
        - name: CLICKHOUSE_USER
          valueFrom:
            configMapKeyRef:
              name: finops-config
              key: CLICKHOUSE_USER
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: finops-secrets
              key: clickhouse-password
        - name: KAFKA_BROKERS
          valueFrom:
            configMapKeyRef:
              name: finops-config
              key: KAFKA_BROKERS
        - name: USD_TO_BRL_RATE
          valueFrom:
            configMapKeyRef:
              name: finops-config
              key: USD_TO_BRL_RATE
        livenessProbe:
          httpGet:
            path: /live
            port: 8082
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8082
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          limits:
            cpu: 1000m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cost-analytics
  namespace: finops
spec:
  selector:
    app: cost-analytics
  ports:
  - port: 8082
    targetPort: 8082

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "finops.fullname" . }}-gateway
  labels:
    {{- include "finops.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicaCount | default .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "finops.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "finops.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
    spec:
      containers:
        - name: gateway
          image: {{ include "finops.image" (dict "Values" .Values "repository" .Values.gateway.image.repository "tag" .Values.gateway.image.tag) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "finops.fullname" . }}-secrets
                  key: jwt-secret
            - name: POSTGRES_DSN
              value: "postgres://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@{{ include "finops.fullname" . }}-postgresql:5432/{{ .Values.postgresql.auth.database }}?sslmode=disable"
            - name: REDIS_ADDR
              value: "{{ include "finops.fullname" . }}-redis-master:6379"
            - name: RATE_LIMIT_RPS
              value: "{{ .Values.gateway.env.RATE_LIMIT_RPS }}"
            - name: RATE_LIMIT_BURST
              value: "{{ .Values.gateway.env.RATE_LIMIT_BURST }}"
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "finops.fullname" . }}-gateway
  labels:
    {{- include "finops.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ .Values.gateway.service.type }}
  ports:
    - port: {{ .Values.gateway.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "finops.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: gateway

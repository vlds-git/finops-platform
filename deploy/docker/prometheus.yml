global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8080']
    metrics_path: /metrics

  - job_name: 'ingestion-service'
    static_configs:
      - targets: ['ingestion-service:8081']
    metrics_path: /metrics

  - job_name: 'cost-analytics'
    static_configs:
      - targets: ['cost-analytics:8082']
    metrics_path: /metrics

  - job_name: 'alert-manager'
    static_configs:
      - targets: ['alert-manager:8083']
    metrics_path: /metrics

  - job_name: 'forecast-engine'
    static_configs:
      - targets: ['forecast-engine:8001']
    metrics_path: /metrics

  - job_name: 'anomaly-detection'
    static_configs:
      - targets: ['anomaly-detection:8002']
    metrics_path: /metrics

  - job_name: 'recommendation-engine'
    static_configs:
      - targets: ['recommendation-engine:8003']
    metrics_path: /metrics
